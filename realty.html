<script>
  // Скрипт Telegram нужен только внутри мини-приложения: грузим его асинхронно и ждём не дольше 3 секунд.
  // В РФ telegram.org без VPN недоступен, и обычный <script src> держал бы страницу пустой в браузере.
  function whenTelegram(cb) {
    var done = false;
    function go() { if (!done) { done = true; cb(); } }
    if (!/tgWebApp/.test(location.hash + location.search)) return go();
    var s = document.createElement('script');
    s.src = 'https://telegram.org/js/telegram-web-app.js';
    s.onload = s.onerror = go;
    document.head.appendChild(s);
    setTimeout(go, 3000);
  }
</script>

<style>

  });
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeTop(); });
  function closeAll() { S.sheet = null; S.detail = null; $('sheet').hidden = true; $('detail').hidden = true; $('sheet').innerHTML = ''; $('detail').innerHTML = ''; }
  document.addEventListener('input', function (e) {
    var id = e.target.id, v = e.target.value;
    if (e.target.type === 'range') e.target.style.setProperty('--p', ((v - e.target.min) / (e.target.max - e.target.min) * 100) + '%');
    if (id === 'f-name') S.me.name = v; if (id === 'f-phone') S.me.phone = v;
    if (id === 'm-price') S.mort.price = +v; if (id === 'm-down') S.mort.down = +v; if (id === 'm-term') S.mort.term = +v;
    if (id && id.indexOf('m-') === 0) updateMort();
    if (id === 'e-area') { S.est.area = +v; var d = D.districts[S.est.dist], mid = S.est.deal === 'sale' ? S.est.area * d.m2 * (S.est.type === 'house' ? .85 : 1) : S.est.area * d.rent; $('e-area-v').textContent = v + ' м²'; $('e-res').textContent = estRange(mid, S.est.deal); }
    syncTG();
  });
  // точки галереи и защита от «клика» после свайпа
  document.addEventListener('scroll', function (e) {
    var t = e.target; if (!t.matches || !t.matches('[data-track]')) return;
    var i = Math.round(t.scrollLeft / t.clientWidth), dots = t.parentNode.querySelectorAll('.dots i');
    dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
    var c = t.closest('#detail') && $('gcount'); if (c) c.textContent = (i + 1) + ' / ' + t.children.length;
    t.dataset.moved = '1'; clearTimeout(t._mv); t._mv = setTimeout(function () { t.dataset.moved = '0'; }, 250);
  }, true);
  // колесо мыши листает фото и ленты вбок (на компьютере)
  document.addEventListener('wheel', function (e) {
    var t = e.target.closest('[data-track], .chips, .days, .similar'); if (!t || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    var max = t.scrollWidth - t.clientWidth; if (max <= 0 || (e.deltaY < 0 && t.scrollLeft <= 0) || (e.deltaY > 0 && t.scrollLeft >= max - 1)) return;
    e.preventDefault(); t.scrollLeft += t.matches('[data-track]') ? Math.sign(e.deltaY) * t.clientWidth : e.deltaY;
  }, { passive: false });

  // ---------- запуск ----------
  function load(cb) {
    if (!API) { $('view').innerHTML = '<div class="wrap"><div class="empty"><div class="em">⚠️</div><b>Нет адреса сервера</b>Откройте приложение из бота.</div></div>'; return; }
    fetch(API + '/realty-data').then(function (r) { return r.json(); }).then(function (j) { D = j; cb && cb(); })
      .catch(function () { $('view').innerHTML = '<div class="wrap"><div class="empty"><div class="em">📡</div><b>Не удалось загрузить каталог</b>Проверьте интернет и откройте приложение ещё раз.</div></div>'; });
  }
  if (tg) {
    try { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    document.documentElement.classList.toggle('dark', tg.colorScheme === 'dark');
    try { tg.setHeaderColor(tg.colorScheme === 'dark' ? '#0c1220' : '#f5f3ee'); tg.setBackgroundColor(tg.colorScheme === 'dark' ? '#0c1220' : '#f5f3ee'); } catch (e) {}
    if (inTG) { tg.MainButton.onClick(onMain); tg.BackButton.onClick(closeTop); tg.onEvent('themeChanged', function () { document.documentElement.classList.toggle('dark', tg.colorScheme === 'dark'); }); }
  }
  if (!inTG && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
  var u = inTG && tg.initDataUnsafe && tg.initDataUnsafe.user;
  sget(['fav', 'name', 'phone', 'consent'], function (st) {
    try { S.favs = JSON.parse(st.fav || '[]'); } catch (e) { S.favs = []; }
    S.me = { name: st.name || (u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : ''), phone: st.phone || '', consent: st.consent === '1' };
    load(function () {
      S.favs = S.favs.filter(L); $('city').textContent = D.agency.city + ' · ' + D.agency.years + ' лет';
      var t = qs.get('tab'); if (t && ['catalog', 'map', 'fav', 'mort'].indexOf(t) >= 0) S.tab = t;
      render();
      var id = qs.get('id'); if (id && L(id)) { S.deal = L(id).deal; render(); openDetail(id); }
    });
  });
});
</script>
</body>
</html>
