  // Скрипт Telegram нужен только внутри мини-приложения: грузим его асинхронно и ждём не дольше 3 секунд.
  // В РФ telegram.org без VPN недоступен, и обычный <script src> держал бы страницу пустой в браузере.
  function whenTelegram(cb) {
    var done = false;
    function go() { if (!done) { done = true; cb(); } }
    if (!/tgWebApp/.test(location.hash + location.search)) return go();
    var s = document.createElement('script');
    s.src = 'https://telegram.org/js/telegram-web-app.js';
    s.onload = s.onerror = go;
    document.head.appendChild(s);
    setTimeout(go, 3000);
  }
</script>

<style>

    --bg: #f4efe7; --card: #fffdf9; --text: #1f1a15; --hint: #8a8075; --line: rgba(31,26,21,.10);

    --bg: #12100e; --card: #1b1815; --text: #efe7dd; --hint: #988e83; --line: rgba(255,255,255,.08);
    --chip: #26211d; --busy: #221e1a; --accent-soft: rgba(214,138,74,.16); --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light):not(.tg) {

      --chip: #26211d; --busy: #221e1a; --accent-soft: rgba(214,138,74,.16); --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body.has-bar { padding-bottom: 92px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px 28px; }

  /* ---------- hero: ночная сцена ---------- */
  .hero { position: relative; margin: 0 -16px; height: 232px; overflow: hidden; color: #f6efe6; background: #0f1326; }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .steam path { animation: rise 7s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; opacity: 0; }

  .steam path:nth-child(3) { animation-delay: 4.6s; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(6px) scaleY(.85); } 30% { opacity: .55; } 100% { opacity: 0; transform: translateY(-16px) scaleY(1.1); } }
  .twinkle { animation: twinkle 4s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .25; } }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,10,14,.72) 0%, rgba(12,10,14,.25) 62%, transparent 100%); }
  .hero-in { position: absolute; left: 20px; right: 20px; bottom: 20px; z-index: 1; max-width: 66%; }
  .eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .82; margin-bottom: 8px; }
  .eyebrow .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #8fe0a2; margin-right: 7px; vertical-align: 2px; box-shadow: 0 0 0 3px rgba(143,224,162,.18); }
  .hero h1 { font-family: var(--serif); font-weight: 600; font-size: 31px; line-height: 1.02; margin: 0 0 8px; letter-spacing: .005em; }
  .hero-sub { font-size: 13px; opacity: .78; }
  .hero-sub .star { color: #f0b46a; }
  .compact { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 18px 2px 2px; }
  .compact b { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  .compact span { font-size: 12.5px; color: var(--hint); text-align: right; }

  /* ---------- шаги ---------- */
  .progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 4px; }
  .progress div { font-size: 12px; color: var(--hint); padding-top: 8px; border-top: 2px solid var(--line); transition: .25s; }
  .progress i { font-style: normal; font-family: var(--serif); font-size: 14px; font-weight: 700; margin-right: 4px; }
  .progress .on { color: var(--text); border-color: var(--accent); font-weight: 600; }
  .progress .on i, .progress .past i { color: var(--accent); }
  .progress .past { border-color: var(--accent); opacity: .75; }

  h2 { font-family: var(--serif); font-weight: 600; font-size: 27px; line-height: 1.1; margin: 22px 2px 14px; }
  h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--hint); margin: 24px 4px 10px; font-weight: 600; }
  .card { background: var(--card); border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); }

  /* ---------- залы ---------- */
  .hall { position: relative; display: flex; width: 100%; text-align: left; margin-bottom: 12px; overflow: hidden; transition: transform .15s, border-color .2s; }

  .hall.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .hall-art { flex: 0 0 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f6efe6; position: relative;

  .hall-art b { font-family: var(--serif); font-size: 32px; font-weight: 600; line-height: 1; }

  .hall-main { flex: 1; padding: 14px 40px 14px 15px; min-width: 0; }
  .hall-name { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.12; margin-bottom: 6px; }

  .hall-foot b { font-size: 16px; color: var(--text); font-weight: 650; }
  .hall-check { position: absolute; right: 13px; top: 13px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; color: #fff; transition: .2s; }
  .hall.sel .hall-check { background: var(--accent); border-color: var(--accent); }

  /* ---------- даты ---------- */
  .dates { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
  .dates::-webkit-scrollbar { display: none; }
  .date { flex: 0 0 58px; padding: 9px 0 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); text-align: center; transition: .2s; }
  .date small { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--hint); }
  .date b { display: block; font-family: var(--serif); font-size: 25px; font-weight: 600; line-height: 1.1; margin-top: 2px; }
  .date.we small { color: var(--accent); }
  .date.sel { background: var(--text); border-color: var(--text); color: var(--bg); }
  .date.sel small { color: var(--bg); opacity: .7; }

  /* ---------- степперы ---------- */
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stepbox { padding: 12px 12px 13px; }
  .stepbox .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--hint); margin-bottom: 9px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; }
  .stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); font-size: 18px; line-height: 1; display: grid; place-items: center; transition: .15s; }

  .stepper b { font-family: var(--serif); font-size: 24px; font-weight: 600; min-width: 44px; text-align: center; }

  /* ---------- время ---------- */
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }

  .slot.nofit { color: var(--hint); font-weight: 400; }
  .slot.in { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .slot.first, .slot.last { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .sum { padding: 6px 15px 8px; }

  .sum .l span:first-child { color: var(--hint); }
  .sum .l span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .sum .tot { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 12px; align-items: baseline; }
  .sum .tot span:first-child { color: var(--text); font-weight: 600; }
  .sum .tot span:last-child { font-family: var(--serif); font-size: 26px; font-weight: 600; }
  .sum .pre { color: var(--accent); font-weight: 600; }
  .consent { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; margin-top: 12px; padding: 13px 15px; font-size: 13.5px; line-height: 1.45; }
  .consent .box { flex: 0 0 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--hint); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; margin-top: 1px; transition: .15s; }
  .consent.on .box { background: var(--accent); border-color: var(--accent); }
  .consent .lnk { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .consent-ok { margin-top: 12px; font-size: 13px; color: var(--ok); padding: 0 4px; }
  .rules { font-size: 12.5px; color: var(--hint); margin: 12px 4px 0; }
  .rules div { margin: 3px 0; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(10,8,6,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
  .sheet { background: var(--card); color: var(--text); width: 100%; max-width: 520px; max-height: 84vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 22px 20px calc(18px + env(safe-area-inset-bottom)); animation: up .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0 0 12px; color: var(--text); text-transform: none; letter-spacing: 0; font-family: var(--serif); font-size: 24px; font-weight: 600; }
  .sheet p { font-size: 14px; margin: 0 0 10px; }

  /* ---------- кнопка вне Telegram ---------- */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); }
  .cta { display: block; width: 100%; max-width: 488px; margin: 0 auto; height: 52px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 15.5px; letter-spacing: .01em; box-shadow: 0 8px 22px rgba(180,101,42,.28); transition: .2s; }
  .cta:disabled { background: var(--busy); color: var(--hint); box-shadow: none; cursor: default; }

  /* ---------- готово ---------- */
  .done { text-align: center; padding: 44px 4px 8px; }
  .done-ic { width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 34px; position: relative;
    animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  .done-ic::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid var(--accent); opacity: .35; animation: ring 1.6s ease-out .3s both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes ring { from { transform: scale(.8); opacity: .6 } to { transform: scale(1.35); opacity: 0 } }
  .done h2 { margin: 0 0 8px; font-size: 30px; }
  .done p { color: var(--hint); margin: 0 auto 20px; max-width: 360px; }
  .done .card { text-align: left; }
  .demo-hint { margin-top: 14px; padding: 13px 15px; border-radius: 14px; background: var(--accent-soft); font-size: 13.5px; text-align: left; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 20px); opacity: 0; transition: .2s; pointer-events: none;
    background: rgba(24,20,16,.94); color: #f6efe6; padding: 11px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; z-index: 30; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fade { animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .steam path, .twinkle, .fade, .done-ic, .done-ic::after, .sheet { animation: none !important; } .steam path { opacity: .4; } }
</style>

  }
  function busySet(h, s) {
    var r = seeded(BATH.slug + h.id + s), set = {}, n = (isWeekend(s) ? 2 : 1) + Math.floor(r() * 2);
    for (var i = 0; i < n; i++) {

  function calc() {
    var h = hall(); if (!h) return null;

    var extrasSum = items.reduce(function (a, b) { return a + b.sum; }, 0), total = hallSum + guestsSum + extrasSum;

  // ---------- submit ----------

    if (S.sending) return;

    var payload = {
      bath: BATH.slug, hallId: h.id, date: S.date, start: S.start, hours: S.dur, guests: S.guests, extras: extras,
      total: c.total, prepay: c.prepay, name: S.name.trim(), phone: S.phone, comment: S.comment.trim(), consent: !!S.consent,
      dateLabel: dateLabel(S.date), initData: inTG ? tg.initData : '', user: u || null
    };
    var rows = summaryRows(c);
    S.sending = true; updateCTA();
    if (inTG) tg.MainButton.showProgress(false);
    var req = API
      ? fetch(API + '/banya-booking', { method: 'POST', body: new URLSearchParams({ data: JSON.stringify(payload) }) }).then(function (r) { return r.ok; })
      : new Promise(function (res) { setTimeout(function () { res(true); }, 700); });
    req.catch(function () { return false; }).then(function (ok) {
      S.sending = false;
      if (inTG) tg.MainButton.hideProgress();
      if (ok) { S.done = { calc: c, rows: rows }; haptic('success'); render(true); }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    var act = t.getAttribute('data-act'), v = t.getAttribute('data-v'), h = hall();
    if (act === 'main') return onMain();
    if (act === 'sheet') { S.sheet = true; haptic('tap'); return render(); }
    if (act === 'sheet-close') { S.sheet = false; return render(); }
    if (act === 'sheet-body') return;
    if (act === 'sheet-agree') { S.sheet = false; S.consent = true; haptic('success'); return render(); }
    if (act === 'consent') { S.consent = !S.consent; haptic('tap'); return render(); }
    if (act === 'hall') {
      var nh = BATH.halls.filter(function (x) { return x.id === v; })[0];
      if (S.hallId !== v) {
        S.hallId = v; S.start = null; S.dur = nh.minHours; S.guests = Math.min(Math.max(S.guests, 1), nh.capacity);
        Object.keys(S.extras).forEach(function (k) { if (!visibleExtras().some(function (x) { return x.id === k; })) delete S.extras[k]; });
      }
      haptic('tap'); render();
      if (!inTG) { var b = document.getElementById('cta'); b && b.animate && b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }], 260); }
      return;
    }
    if (act === 'date') { S.date = v; if (S.start != null && !canStart(h, S.date, S.start, S.dur, busySet(h, S.date))) S.start = null; haptic('tap'); return render(); }
    if (act === 'dur') {
      S.dur += +v;
      if (S.start != null && !canStart(h, S.date, S.start, S.dur, busySet(h, S.date))) { S.start = null; toast('Выбранное время не вмещает ' + S.dur + ' ч — выберите заново'); }
      haptic('tap'); return render();
    }
    if (act === 'guests') {
      S.guests += +v;
      BATH.extras.forEach(function (x) { if (x.perGuest && S.extras[x.id] > S.guests) S.extras[x.id] = S.guests; });
      haptic('tap'); return render();
    }
    if (act === 'slot') {
      var k = +v, busy = busySet(h, S.date);
      if (busy[k]) { haptic('warning'); return toast('Это время уже забронировано'); }
      if (!canStart(h, S.date, k, S.dur, busy)) {
        haptic('warning');
        return toast(k < minStart(S.date) ? 'Это время уже прошло' : k + S.dur > BATH.close ? 'С ' + hh(k) + ' не успеем ' + S.dur + ' ч до закрытия' : 'С ' + hh(k) + ' на ' + S.dur + ' ч не получится — дальше занято');
      }
      S.start = k; haptic('tap'); return render();
    }
    if (act === 'ex') {
      var id = t.getAttribute('data-id'), ex = BATH.extras.filter(function (x) { return x.id === id; })[0];
      var q = Math.max(0, Math.min(extraMax(ex), (S.extras[id] || 0) + (+v)));
      if (q) S.extras[id] = q; else delete S.extras[id];
      haptic('tap'); return render();
    }
    if (act === 'contact') {
      tg.requestContact(function (shared, res) {
        var c = res && res.responseUnsafe && res.responseUnsafe.contact;
        if (shared && c && c.phone_number) { S.phone = fmtPhone(String(c.phone_number)); haptic('success'); render(); }
        else if (shared) toast('Номер отправлен в чат — впишите его здесь тоже');
      });
    }
  });
  app.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'f-name') S.name = e.target.value;
    if (id === 'f-comment') S.comment = e.target.value;
    if (id === 'f-phone') { var f = fmtPhone(e.target.value); if (e.inputType && e.inputType.indexOf('delete') === 0) S.phone = e.target.value; else { S.phone = f; e.target.value = f; } }
    updateCTA();
  });

  // ---------- boot ----------
  function applyTheme() {
    var root = document.documentElement.style;
    if (BATH.accent) root.setProperty('--accent', BATH.accent);
    if (!inTG) return;
    // своя палитра (бумага / ночь), а светлую или тёмную выбираем по теме Telegram
    var dark = tg.colorScheme === 'dark';
    document.documentElement.classList.add('tg');
    document.documentElement.classList.toggle('dark', dark);
    try { tg.setHeaderColor('#0e1228'); tg.setBackgroundColor(dark ? '#12100e' : '#f4efe7'); } catch (e) {}
    tg.onEvent && tg.onEvent('themeChanged', function () { document.documentElement.classList.toggle('dark', tg.colorScheme === 'dark'); });
  }
  function start() {
    if (!BATH || !BATH.halls) BATH = DEFAULT_BATH;
    S.date = iso(new Date());
    var u = inTG && tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) S.name = [u.first_name, u.last_name].filter(Boolean).join(' ');
    applyTheme();
    if (inTG) {
      tg.MainButton.onClick(onMain);
      tg.BackButton.onClick(function () { if (S.step > 1 && !S.done) go(S.step - 1); });
    }
    render(true);
  }

  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  if (!BATH && API) {
    var ctl = window.AbortController ? new AbortController() : null;
    if (ctl) setTimeout(function () { ctl.abort(); }, 4000);
    fetch(API + '/banya-config?b=' + encodeURIComponent(qs.get('b') || ''), ctl ? { signal: ctl.signal } : {})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.halls) BATH = j; })
      .catch(function () {})
      .then(start);
  } else start();
});
</script>
</body>
</html>
